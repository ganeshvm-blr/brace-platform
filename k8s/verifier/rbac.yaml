apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${VERIFIER_SERVICE_ACCOUNT}
  namespace: default
  labels:
    app.kubernetes.io/managed-by: brace
    brace.io/run-id: "${RUN_ID}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${VERIFIER_CLUSTER_ROLE}
  labels:
    app.kubernetes.io/managed-by: brace
    brace.io/run-id: "${RUN_ID}"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${VERIFIER_CLUSTER_ROLE_BINDING}
  labels:
    app.kubernetes.io/managed-by: brace
    brace.io/run-id: "${RUN_ID}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${VERIFIER_CLUSTER_ROLE}
subjects:
  - kind: ServiceAccount
    name: ${VERIFIER_SERVICE_ACCOUNT}
    namespace: default
