[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brace-platform"
version = "0.1.0"
description = "Kubernetes recoverability verification orchestration with a pluggable reasoning boundary"
requires-python = ">=3.10"
license-files = []
dependencies = [
    "kubernetes",
    "urllib3",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
